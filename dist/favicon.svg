<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0b5"/>
      <stop offset="100%" stop-color="#dfb193"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>
  
  <!-- Subtle ambient glow -->
  <circle cx="200" cy="160" r="140" fill="#27272a" opacity="0.6"/>

  <g filter="url(#shadow)">
    <!-- Clothing: Dark minimalist turtleneck / crewneck -->
    <path d="M 110 370 C 110 300, 150 280, 200 280 C 250 280, 290 300, 290 370 L 290 400 L 110 400 Z" fill="#141416"/>
    <!-- Collar -->
    <path d="M 165 285 C 165 272, 180 268, 200 268 C 220 268, 235 272, 235 285 C 235 295, 220 302, 200 302 C 180 302, 165 295, 165 285 Z" fill="#1f1f23"/>

    <!-- Neck -->
    <path d="M 178 220 L 178 275 C 185 280, 215 280, 222 275 L 222 220 Z" fill="url(#skin)"/>
    <path d="M 178 245 C 190 255, 210 255, 222 245 L 222 270 C 210 274, 190 274, 178 270 Z" fill="#000" opacity="0.12"/>

    <!-- Ears -->
    <ellipse cx="140" cy="195" rx="12" ry="18" fill="url(#skin)"/>
    <ellipse cx="260" cy="195" rx="12" ry="18" fill="url(#skin)"/>

    <!-- Head / Face -->
    <path d="M 145 170 C 145 120, 165 110, 200 110 C 235 110, 255 120, 255 170 C 255 225, 235 245, 200 245 C 165 245, 145 225, 145 170 Z" fill="url(#skin)"/>

    <!-- Hair - sleek, textured product designer crop -->
    <path d="M 142 160 C 140 120, 160 85, 200 85 C 240 85, 260 115, 258 155 C 250 140, 240 135, 225 135 C 215 135, 210 138, 200 135 C 185 130, 160 138, 142 160 Z" fill="url(#hair)"/>
    <!-- Subtle hair volume -->
    <path d="M 152 110 C 170 95, 205 92, 235 100 C 248 105, 255 115, 255 115 C 240 102, 210 98, 180 105 C 165 108, 155 115, 152 110 Z" fill="#333" opacity="0.4"/>

    <!-- Eyebrows -->
    <path d="M 165 168 Q 178 164 188 168" stroke="#222" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 212 168 Q 222 164 235 168" stroke="#222" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Eyes -->
    <ellipse cx="177" cy="180" rx="4.5" ry="5.5" fill="#18181b"/>
    <circle cx="178.5" cy="178.5" r="1.5" fill="#fff"/>
    <ellipse cx="223" cy="180" rx="4.5" ry="5.5" fill="#18181b"/>
    <circle cx="224.5" cy="178.5" r="1.5" fill="#fff"/>

    <!-- Modern Minimalist Designer Glasses -->
    <rect x="156" y="166" width="38" height="28" rx="8" fill="none" stroke="#27272a" stroke-width="2.8"/>
    <rect x="206" y="166" width="38" height="28" rx="8" fill="none" stroke="#27272a" stroke-width="2.8"/>
    <path d="M 194 176 L 206 176" stroke="#27272a" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 156 176 L 142 173" stroke="#27272a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 244 176 L 258 173" stroke="#27272a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Glass lens subtle reflection -->
    <path d="M 160 170 L 172 170 L 164 190 L 160 190 Z" fill="#fff" opacity="0.12"/>
    <path d="M 210 170 L 222 170 L 214 190 L 210 190 Z" fill="#fff" opacity="0.12"/>

    <!-- Nose -->
    <path d="M 200 178 L 198 198 Q 200 202 205 200" stroke="#c99878" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Calm friendly slight smile -->
    <path d="M 188 218 Q 200 224 212 218" stroke="#995843" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Border Frame Subtle Accent -->
  <rect x="1.5" y="1.5" width="397" height="397" rx="0" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
</svg>
